[package]
name = "cozyverse-breakdown"
version = "0.1.0"
description = "CozyVerse Breakdown desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cozyverse_breakdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
